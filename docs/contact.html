<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact Us - World Journey</title>
  <link rel="stylesheet" href="style.css">

  <style>
    body {
      background: linear-gradient(to right, #4facfe, #00f2fe);
    }

    .contact-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 40px;
    }

    .contact-box {
      background: white;
      border-radius: 15px;
      display: flex;
      overflow: hidden;
      max-width: 900px;
      width: 100%;
      box-shadow: 0 5px 25px rgba(0,0,0,0.2);
    }

    .contact-left {
      background: #007bff;
      color: white;
      padding: 40px;
      width: 40%;
    }

    .contact-left h2 {
      margin-bottom: 20px;
    }

    .contact-left p {
      margin: 10px 0;
    }

    .contact-right {
      padding: 40px;
      width: 60%;
    }

    .contact-right h2 {
      margin-bottom: 20px;
    }

    .contact-right input,
    .contact-right textarea {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border-radius: 8px;
      border: 1px solid #ccc;
    }

    .contact-right button {
      background: #007bff;
      color: white;
      padding: 12px;
      border: none;
      width: 100%;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.3s;
    }

    .contact-right button:hover {
      background: #0056b3;
    }

    @media (max-width: 768px) {
      .contact-box {
        flex-direction: column;
      }

      .contact-left,
      .contact-right {
        width: 100%;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>World Journey</h1>
  <nav>
    <a href="index.html">Home</a>
    <a href="index.html#destinations">Plan</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
  </nav>
</header>

<div class="contact-wrapper">

  <div class="contact-box">

    <!-- LEFT SIDE INFO -->
    <div class="contact-left">
      <h2>Contact Info</h2>
      <p>📧 worldjourney@gmail.com</p>
      <p>📞 +91 9876543210</p>
      <p>📍 India</p>

      <br>
      <p>We are here to help you plan your dream trip. Feel free to contact us anytime!</p>
    </div>

    <!-- RIGHT SIDE FORM -->
    <div class="contact-right">
      <h2>Send Message</h2>

      <form>
        <input type="text" placeholder="Your Name" required>
        <input type="email" placeholder="Your Email" required>
        <textarea rows="5" placeholder="Your Message"></textarea>
        <button type="submit">Send Message</button>
      </form>
    </div>

  </div>

</div>

</body>
</html>
