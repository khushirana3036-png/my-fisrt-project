<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>World Journey</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <h1>World Journey</h1>
</header>

<section class="destinations">
  <h2>Popular Destinations</h2>

  <div class="card">
    <h3>Paris</h3>
    <p>₹5000</p>
    <button onclick="openPopup('Paris',5000)">Book Ticket</button>
  </div>

  <div class="card">
    <h3>Dubai</h3>
    <p>₹6200</p>
    <button onclick="openPopup('Dubai',6200)">Book Ticket</button>
  </div>

</section>

<!-- BOOKING POPUP -->
<div id="popup" class="popup">
  <div class="popup-content">
    <span onclick="closePopup()" class="close">&times;</span>

    <h2>Book Ticket</h2>

    <form id="bookingForm">
      <input type="text" id="name" placeholder="Your Name" required>
      <input type="email" id="email" placeholder="Email" required>
      <input type="text" id="city" readonly>
      <input type="number" id="tickets" placeholder="Tickets" required>
      <input type="text" id="total" readonly>

      <button type="submit">Confirm Booking</button>
    </form>

  </div>
</div>

<!-- SUCCESS POPUP -->
<div id="successPopup" class="popup">
  <div class="popup-content" style="text-align:center">
    <h2>🎉 Booking Confirmed!</h2>
    <p>Your ticket has been successfully booked.</p>
    <button onclick="closeSuccess()">OK</button>
  </div>
</div>

<script type="module" src="script.js"></script>

</body>
</html>
